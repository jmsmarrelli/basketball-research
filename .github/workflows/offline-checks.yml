name: Offline regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Unit and committed-output checks (full archive checks remain in Reproduce research)
        run: python -m pytest -q -m 'not requires_raw'
      - run: python tools/page.py --check
